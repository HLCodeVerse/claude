# ==============================================================================
# Evolution API v2 - Docker Compose Stack
# Multi-container setup with PostgreSQL, Redis & Evolution API
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password_secure
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evolution_net

  # ----------------------------------------------------------------------------
  # Redis Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - evolution_net

  # ----------------------------------------------------------------------------
  # Evolution WhatsApp API Service
  # ----------------------------------------------------------------------------
  evolution-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=evol_whatsapp_api_secret_key_2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - SERVER_DISABLE_DOCS=false
      - SERVER_DISABLE_MANAGER=false
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false

      # PostgreSQL Database Settings
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password_secure@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v2
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true

      # Redis Cache Settings
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_public:/evolution/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evolution_net

volumes:
  postgres_data:
    name: evolution_postgres_data
  redis_data:
    name: evolution_redis_data
  evolution_instances:
    name: evolution_instances_data
  evolution_public:
    name: evolution_public_data

networks:
  evolution_net:
    name: evolution_network
    driver: bridge
